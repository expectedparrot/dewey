[project]
name = "dewey"
version = "0.1.0"
description = "Filesystem-backed bibliography CLI"
requires-python = ">=3.11"
dependencies = [
  "paper2md @ git+https://github.com/expectedparrot/paper2md.git",
  "typer>=0.12.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0"
]

[project.scripts]
dewey = "dewey.cli:main"
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
